[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-pilot"
version = "0.1.0"
description = "Auditable post-contest Codeforces data collection for an RL course project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cf-pilot = "cf_pilot.cli:main"

[tool.setuptools.packages.find]
include = ["cf_pilot*"]

